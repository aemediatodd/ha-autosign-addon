<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoSign 自动签到</title><style>
:root{font:16px/1.6 system-ui,sans-serif;color:#dfe8f5;background:#101827}body{max-width:1000px;margin:32px auto;padding:0 20px}h1{font-size:28px;margin-bottom:4px}p{color:#a6b8cf}section{background:#1b283c;border:1px solid #304258;border-radius:12px;padding:20px;margin:18px 0}h2{font-size:19px;margin:0 0 10px}label{display:block;margin:10px 0;color:#becce0}input,select{box-sizing:border-box;background:#111d2f;color:#eef4ff;border:1px solid #49617c;border-radius:6px;padding:9px;width:100%}input[type=checkbox]{width:auto;margin-right:8px}button{background:#64d4bd;color:#092722;border:0;border-radius:6px;padding:10px 18px;cursor:pointer;margin:5px 8px 5px 0}button.secondary{background:#344d6a;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.grid section{margin:0}.warn{color:#ffd486}#notice{white-space:pre-wrap;color:#64d4bd}pre{white-space:pre-wrap;overflow-wrap:anywhere}.failed{color:#ffadac}.success{color:#64d4bd}small{color:#a6b8cf}details{margin-top:12px}
</style></head><body><h1>AutoSign 自动签到</h1><p>在 Home Assistant 内管理每日签到。配置仅保存在此加载项本地。</p>
<section><h2>运行与结果</h2><button id="run">执行已启用的平台</button><button class="secondary" id="refresh">刷新结果</button><div id="notice" role="status"></div><div id="status"></div><small>先保存配置，再执行。真实签到会登录账户并提交签到请求；不会自动重试。</small></section>
<section><h2>每日计划</h2><label><input id="enabled" type="checkbox">启用每日定时</label><label>执行时间<input type="time" id="time"></label><label>时区<input id="timezone" placeholder="Asia/Hong_Kong"></label><small>每天最多自动执行一次；若启动时已过执行时间，会补执行当天任务。手动执行不受此限制。</small></section>
<div class="grid" id="accounts"></div>
<section><h2>结果推送</h2><label>推送方式<select id="pushMode"><option value="">关闭</option><option value="qmsg">Qmsg</option><option value="server">Server 酱</option><option value="epwc">企业微信</option><option value="dingtalk">钉钉机器人</option></select></label><div id="pushFields"></div></section>
<button id="save">保存配置（立即生效）</button><p class="warn">小黑盒：未测试，默认关闭；沿用上游旧接口及第三方 HTTP 签名服务，不保证可用。</p>
<script>
const token='__CSRF_TOKEN__';let config;
const platforms={MiUI:['MIUI 历史版本',{user:'账号',password:'密码'}],gtfed:['好游快爆',{cookie:'新版玉米农场 ajax_sign.php 的完整签到表单（不是 Cookie 头）'}],JiaoYiMao:['交易猫',{cookie:'Cookie（包含 _csrfToken，如有）'}],tyyp:['天翼云盘',{username:'账号',password:'密码'}],wyyyx:['网易云游戏',{cookie:'Authorization 完整值'}],XiaoHeiHe:['小黑盒（未测试）',{cookie:'Cookie',imei:'IMEI（可选）'}]};
function el(tag,text){const e=document.createElement(tag);if(text)e.textContent=text;return e}
async function api(path,body){const r=await fetch('./api/'+path,{method:body===undefined?'GET':'POST',headers:{'X-AutoSign-Token':token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败或任务正在运行');return v}
function note(s){document.getElementById('notice').textContent=s}
function field(parent,label,value,type='password'){const l=el('label',label);const i=el('input');i.type=type;if(type==='checkbox')i.checked=value;else i.value=value;i.autocomplete='off';l.append(i);parent.append(l);return i}
const accountInputs={},pushInputs={};
function render(){for(const [key,[name,fields]]of Object.entries(platforms)){const card=el('section');card.append(el('h2',name));const enabled=field(card,'启用此平台',config.accounts[key].switch,'checkbox');accountInputs[key]={switch:enabled};for(const [key2,label]of Object.entries(fields))accountInputs[key][key2]=field(card,label,config.accounts[key][key2]);const b=el('button','仅测试此平台');b.className='secondary';b.onclick=()=>run(key);card.append(b);document.getElementById('accounts').append(card)}
document.getElementById('enabled').checked=config.schedule_enabled;document.getElementById('time').value=config.run_time;document.getElementById('timezone').value=config.timezone;document.getElementById('pushMode').value=config.push.PushMode;
for(const [key,value]of Object.entries(config.push.PushKey)){const d=el('details');d.append(el('summary',key));pushInputs[key]={};if(typeof value==='string')pushInputs[key]=field(d,key,value);else for(const [k,v]of Object.entries(value))pushInputs[key][k]=field(d,k,v,typeof v==='boolean'?'checkbox':'password');document.getElementById('pushFields').append(d)}}
function collect(){const c=structuredClone(config);c.schedule_enabled=document.getElementById('enabled').checked;c.run_time=document.getElementById('time').value;c.timezone=document.getElementById('timezone').value;c.push.PushMode=document.getElementById('pushMode').value;for(const [k,fs]of Object.entries(accountInputs))for(const [f,i]of Object.entries(fs))c.accounts[k][f]=i.type==='checkbox'?i.checked:i.value;for(const[k,fs]of Object.entries(pushInputs)){if(fs instanceof HTMLInputElement)c.push.PushKey[k]=fs.value;else for(const[f,i]of Object.entries(fs))c.push.PushKey[k][f]=i.type==='checkbox'?i.checked:i.value}return c}
async function refresh(){const s=await api('status');const box=document.getElementById('status');box.replaceChildren(el('p',s.running?'运行中…':`最近执行：${s.last_run||'尚未运行'} · 推送：${s.push}`));for(const r of s.results){const p=el('pre',`${r.name} · ${r.status}\n${r.message}`);p.className=r.status;box.append(p)}}
async function run(platform){try{if(platform&&!config.accounts[platform].switch)throw Error('请先启用此平台并保存配置');await api('run',{platform});note('任务已启动');await refresh()}catch(e){note(e.message)}}
document.getElementById('save').onclick=async()=>{try{const c=collect();await api('config',c);config=c;note('配置已保存并立即生效，无需重启')}catch(e){note(e.message)}};
document.getElementById('run').onclick=()=>run(null);document.getElementById('refresh').onclick=()=>refresh().catch(e=>note(e.message));
(async()=>{try{config=await api('config');render();await refresh();setInterval(()=>refresh().catch(()=>{}),4000)}catch(e){note(e.message)}})();
</script></body></html>
